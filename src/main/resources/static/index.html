<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: system-ui, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .calc {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* ---------- display ---------- */
        .display {
            flex: 1;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 8px 12px;
            word-break: break-all;
            text-align: right;
        }
        .expression {
            font-size: 44px;
            line-height: 1.2;
            min-height: 53px;
        }
        .expression::after {           /* the blinking-cursor look from the phone */
            content: "";
            border-right: 2px solid #5ec8c0;
            margin-left: 2px;
        }
        .error {
            font-size: 20px;
            color: #e8735a;
            min-height: 28px;
        }

        /* ---------- backspace row ---------- */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            padding: 8px;
            border-bottom: 1px solid #222;
        }
        .toolbar button {
            background: none;
            border: 0;
            color: #4c7a3a;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 10px;
        }

        /* ---------- keypad ---------- */
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            padding-top: 18px;
        }
        .keys button {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid #2a2a2a;
            background: #1c1c1c;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .keys button:active,
        .toolbar button:active { opacity: 0.6; }
        .keys button:focus-visible,
        .toolbar button:focus-visible { outline: 2px solid #5ec8c0; outline-offset: 2px; }

        .keys .op     { color: #8fd45a; }                              /* green operators */
        .keys .clear  { color: #e8735a; }                              /* orange C */
        .keys .equals { background: #3f7d0e; border-color: #3f7d0e; }  /* green = */
    </style>
</head>
<body>

<div class="calc">

    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="error" id="error"></div>
    </div>

    <div class="toolbar">
        <button type="button" data-key="back" aria-label="Backspace">&#9003;</button>
    </div>

    <div class="keys">
        <!-- row 1 -->
        <button type="button" data-key="C" class="clear" aria-label="Clear">C</button>
        <button type="button" data-key="()" class="op" aria-label="Parentheses">( )</button>
        <button type="button" data-key="%" class="op" aria-label="Percent">%</button>
        <button type="button" data-key="÷" class="op" aria-label="Divide">÷</button>

        <!-- row 2 -->
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="×" class="op" aria-label="Multiply">×</button>

        <!-- row 3 -->
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="-" class="op" aria-label="Subtract">&minus;</button>

        <!-- row 4 -->
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="+" class="op" aria-label="Add">+</button>

        <!-- row 5 -->
        <button type="button" data-key="+/-" aria-label="Plus or minus">+/&minus;</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key=".">.</button>
        <button type="button" data-key="=" class="equals" aria-label="Equals">=</button>
    </div>

</div>

<script>
    const expressionEl = document.getElementById('expression');
    const errorEl = document.getElementById('error');

    let expression = '';   // what is on the display right now

    // Sends the display text and the clicked key to the server, then shows the answer
    async function press(key) {
        try {
            const params = new URLSearchParams({ expression: expression, key: key });
            const response = await fetch('/press?' + params);
            const data = await response.json();

            expression = data.expression || '';
            expressionEl.textContent = expression;
            errorEl.textContent = data.error || '';
        } catch (e) {
            errorEl.textContent = "Can't reach the server";
        }
    }

    // every button has a data-key; clicking it calls press()
    document.querySelectorAll('button[data-key]').forEach(button => {
        button.addEventListener('click', () => press(button.dataset.key));
    });
</script>

</body>
</html>
